# Pinned sources for scripts/build-deps.sh — one package per line, in build order:
#   name  version  url  sha256
#
# Every download is checked against its SHA-256 and the build fails closed on a
# mismatch (printing the hash it got). Where upstream publishes a checksum (GNOME,
# GStreamer, OpenSSL, xiph, cairographics) it was checked against it; GitHub-only
# releases were pinned on first download.
#
# git+<url> lines (the SPICE projects, which tag releases rarely) follow a branch:
# the version column names the branch, the last column is the exact commit built.
#
# To update a package, edit its line — new version + URL (the build then stops and
# prints the new SHA-256 to verify and paste), or a new commit id (`git ls-remote
# <url> <branch>`) — and run ./scripts/build-deps.sh. If one of its patches in
# deps/patches/ no longer applies, see deps/README.md.

